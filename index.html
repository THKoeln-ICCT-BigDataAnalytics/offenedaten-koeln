<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offene Daten Köln Suche</title>
    <script>
      // Farbschema vor dem ersten Rendern setzen, damit die Seite nicht kurz hell aufblitzt.
      (function () {
        var stored = "light";
        try { stored = localStorage.getItem("odk_theme") || "light"; } catch (e) {}
        var dark = stored === "dark" || (stored === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
